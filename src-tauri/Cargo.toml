[package]
name = "dissz-cloud-drive"
version = "0.1.0"
description = "Premium Modern Telegram Cloud Drive"
edition = "2021"

[lib]
name = "dissz_cloud_drive_lib"
path = "src/lib.rs"

[dependencies]
# Tauri v2 Core Dependencies
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"

# Data Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime & Utilities
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
bytes = "1.0"
base64 = "0.22"

# TELEGRAM CLIENT - UNIFIED VERSION 0.8.0 (ANTI BENTROK TIPE DATA)
grammers-client = "0.8.0"
grammers-session = "0.8.0"
grammers-mtsender = "0.8.0"
grammers-tl-types = "0.8.0"

# DATABASE SQLITE (SELARAS DENGAN SENSOR GRAMMERS)
sqlite = "0.37.0"

# Local HTTP Streaming Server
actix-web = "4.0"
actix-files = "0.6"

# Cryptography
aes-gcm = "0.10"
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# PAKSA CARGO MEMBACA CORE2 DARI FOLDER LOKAL KAMU SECARA OFFLINE
[patch.crates-io]
core2 = { path = "core2-mock" }
